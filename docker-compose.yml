version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: spatial_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spatial_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spatial_secret}
      POSTGRES_DB: ${POSTGRES_DB:-spatial_campus_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spatial_admin} -d ${POSTGRES_DB:-spatial_campus_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: spatial_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
